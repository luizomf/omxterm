appId: com.otaviomiranda.omxterm
productName: OMXTerm
copyright: Copyleft 🄯 2026 Rafael Ruscher
asar:
  smartUnpack: false
npmRebuild: false
beforePack: scripts/prepare-linux-launcher.mjs
# The legacy ARM64 AppImage runtime dynamically requests the development-only
# libz.so linker name. Use electron-builder's static runtime so the artifact has
# no host zlib or libfuse2 library dependency.
toolsets:
  appimage: 1.0.3
directories:
  output: release
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  # Linux Terminal Windows resolve their icon from resources because a
  # directly-run AppImage has no registered desktop entry to supply one.
  - from: assets/application-icon.png
    to: application-icon.png
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: assets/fonts/FiraCode-OFL.txt
    to: licenses/FiraCode-OFL.txt
  - from: assets/fonts/DejaVu-LICENSE.txt
    to: licenses/DejaVu.txt
  - from: assets/fonts/JetBrainsMono-OFL.txt
    to: licenses/JetBrainsMono-OFL.txt
  - from: assets/fonts/NerdFonts-glyphs.txt
    to: licenses/NerdFonts-glyphs.txt
  - from: assets/licenses/xterm-visible-links-MIT.txt
    to: licenses/xterm-visible-links.txt
  - from: assets/licenses/ashyterm-MIT.txt
    to: licenses/ashyterm.txt
  - from: node_modules/node-pty/LICENSE
    to: licenses/node-pty.txt
  - from: assets/licenses/restty-MIT.txt
    to: licenses/restty.txt
  - from: assets/licenses/text-shaper-MIT.txt
    to: licenses/text-shaper.txt
  - from: assets/licenses/ghostty-MIT.txt
    to: licenses/ghostty.txt
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
# Each host packages its own architecture (x64 or arm64, chosen by
# scripts/package.mjs from process.arch); native modules are never
# cross-compiled. ${arch} in file patterns is the architecture being packaged.
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  icon: assets/application-icon.icns
  category: public.app-category.developer-tools
  files:
    - dist/**
    - "!dist/**/*.map"
    - "!node_modules/**/*.map"
    - "!node_modules/restty/**"
    - "!node_modules/text-shaper/**"
    - "!scripts/**"
    - "!node_modules/node-addon-api/**"
    - "!node_modules/node-pty/node-addon-api/**"
    - "!node_modules/node-pty/build/**"
    - "!node_modules/node-pty/deps/**"
    # Keep only this architecture's macOS prebuild.
    - "!node_modules/node-pty/prebuilds/!(darwin-${arch})/**"
    - "!node_modules/node-pty/scripts/**"
    - "!node_modules/node-pty/src/**"
    - "!node_modules/node-pty/typings/**"
    - "!node_modules/node-pty/lib/**/*.test.js"
  asarUnpack:
    - dist/main/macos-window-blur.node
    - node_modules/node-pty/prebuilds/darwin-${arch}/pty.node
    - node_modules/node-pty/prebuilds/darwin-${arch}/spawn-helper
  target:
    - dmg
  # Apple Silicon requires a complete code seal even when no Developer ID is
  # used. Explicit ad-hoc signing keeps the bundle internally valid while the
  # release remains unnotarized and carries no verified publisher identity.
  identity: "-"
  hardenedRuntime: false
linux:
  icon: assets/application-icon.png
  category: Utility
  executableName: omxterm
  syncDesktopName: true
  # OMXTerm has no automatic updates (docs/spec.md). Without this the packager
  # derives GitHub update metadata from the checkout's git remote and writes
  # app-update.yml (and, for DEB/RPM, a racy package-type file) into the
  # unpacked application that every Linux package is built from.
  publish: null
  files:
    - dist/**
    - "!dist/main/macos-window-blur.node"
    - "!dist/**/*.map"
    - "!node_modules/**/*.map"
    - "!node_modules/restty/**"
    - "!node_modules/text-shaper/**"
    - "!scripts/**"
    - "!node_modules/node-addon-api/**"
    - "!node_modules/node-pty/node-addon-api/**"
    - "!node_modules/node-pty/deps/**"
    - "!node_modules/node-pty/prebuilds/**"
    - "!node_modules/node-pty/build/Makefile"
    - "!node_modules/node-pty/build/binding.Makefile"
    - "!node_modules/node-pty/build/config.gypi"
    - "!node_modules/node-pty/build/*.target.mk"
    - "!node_modules/node-pty/build/Release/.deps/**"
    - "!node_modules/node-pty/build/Release/.forge-meta"
    - "!node_modules/node-pty/build/Release/node-addon-api/**"
    - "!node_modules/node-pty/build/Release/obj.target/**"
    - "!node_modules/node-pty/scripts/**"
    - "!node_modules/node-pty/src/**"
    - "!node_modules/node-pty/typings/**"
    - "!node_modules/node-pty/lib/**/*.test.js"
  asarUnpack:
    - node_modules/node-pty/build/Release/pty.node
  # scripts/package.mjs builds the AppImage first, then DEB and RPM from the
  # same unpacked application (--prepackaged).
  target:
    - AppImage
    - deb
    - rpm
win:
  icon: assets/application-icon.png
  files:
    - dist/**
    - "!dist/main/macos-window-blur.node"
    - "!dist/**/*.map"
    - "!node_modules/**/*.map"
    - "!node_modules/restty/**"
    - "!node_modules/text-shaper/**"
    - "!scripts/**"
    - "!node_modules/node-addon-api/**"
    - "!node_modules/node-pty/node-addon-api/**"
    - "!node_modules/node-pty/build/**"
    - "!node_modules/node-pty/deps/**"
    # Keep only this architecture's Windows prebuild, without debug symbols.
    - "!node_modules/node-pty/prebuilds/!(win32-${arch})/**"
    - "!node_modules/node-pty/prebuilds/win32-${arch}/*.pdb"
    - "!node_modules/node-pty/scripts/**"
    - "!node_modules/node-pty/src/**"
    - "!node_modules/node-pty/typings/**"
    - "!node_modules/node-pty/lib/**/*.test.js"
  asarUnpack:
    - node_modules/node-pty/prebuilds/win32-${arch}/**
  target:
    - nsis
# DEB and RPM install the unpacked application under /opt/OMXTerm. Linux
# disables the Chromium sandbox before Electron bootstrap (ADR 0024), so both
# the /usr/bin/omxterm launcher and the desktop entry pass --no-sandbox, and the
# maintainer scripts replace the packager defaults that would make
# chrome-sandbox setuid root or install an AppArmor user-namespace profile.
deb:
  maintainer: Rafael Ruscher <rruscher@gmail.com>
  packageCategory: x11
  synopsis: Open-source personal desktop terminal
  description: Open-source personal desktop terminal
  category: Utility;TerminalEmulator
  executableArgs:
    - --no-sandbox
  # electron-builder's default dependencies, plus fontconfig for fc-match.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - fontconfig
  recommends:
    - openssh-client
  afterInstall: packaging/linux/after-install.tpl
  afterRemove: packaging/linux/after-remove.tpl
  fpm:
    - packaging/linux/omxterm=/usr/bin/omxterm
rpm:
  maintainer: Rafael Ruscher <rruscher@gmail.com>
  synopsis: Open-source personal desktop terminal
  description: Open-source personal desktop terminal
  category: Utility;TerminalEmulator
  executableArgs:
    - --no-sandbox
  # electron-builder's default dependencies, plus fontconfig for fc-match.
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - fontconfig
  afterInstall: packaging/linux/after-install.tpl
  afterRemove: packaging/linux/after-remove.tpl
  fpm:
    - --rpm-tag
    - "Recommends: openssh-clients"
    # Own the application directory so removal leaves nothing behind.
    - --directories
    - /opt/OMXTerm
    # Distributions differ on rpmbuild's /usr/lib/.build-id links; without
    # them the package installs exactly the same files on every build host.
    - --rpm-rpmbuild-define
    - _build_id_links none
    - packaging/linux/omxterm=/usr/bin/omxterm
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  # On an ARM64 build host electron-builder compresses the app payload with the
  # ARM64 BCJ2 7-Zip filter, which the NSIS-bundled Nsis7z extraction plugin
  # cannot decode — it silently drops every PE file at install time, leaving a
  # broken install of only the data files. A zip payload uses deflate with no
  # executable filter, which Nsis7z extracts correctly. Disabling the
  # differential package is what lets useZip take effect and costs nothing here:
  # OMXTerm ships no automatic updates (docs/spec.md), so blockmap deltas are
  # unused.
  differentialPackage: false
  useZip: true
dmg:
  sign: false
  title: ${productName} ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
