<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMXTerm</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <nav id="tab-strip" role="tablist" aria-label="Terminal Tabs" hidden></nav>
    <div id="terminal-window-content">
      <aside id="workspace-sidebar" hidden></aside>
      <div id="terminal-tabs"></div>
      <aside id="snippets-sidebar" aria-label="Snippets Sidebar" hidden></aside>
    </div>
    <aside
      id="user-file-errors"
      role="alert"
      aria-label="User File Errors"
      hidden
    ></aside>
    <aside
      id="terminal-surface-failure"
      role="alert"
      aria-label="Terminal Surface Failure"
      hidden
    ></aside>
    <script src="./index.js"></script>
  </body>
</html>
